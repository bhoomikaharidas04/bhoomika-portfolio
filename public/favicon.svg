<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background glow -->
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0e6ff" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#e8dcff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Bubble gradient -->
    <radialGradient id="bubbleGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#e2d2fe" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#c4b5fd" stop-opacity="0.4" />
      <stop offset="85%" stop-color="#a78bfa" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#d8b4fe" stop-opacity="0.85" />
    </radialGradient>

    <!-- Heart gradient -->
    <linearGradient id="heartGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#f5d0fe" />
      <stop offset="30%" stop-color="#e879f9" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#ddd6fe" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#c4b5fd" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fae8ff" stop-opacity="0.95" />
    </linearGradient>

    <!-- Silver Star gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Drop Shadow filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="64" cy="64" r="60" fill="url(#spaceGlow)" />

  <!-- Back part of the planetary ring -->
  <g transform="rotate(-25 64 64)">
    <path d="M -10 64 C -10 46, 138 46, 138 64 C 138 72, 110 74, 64 74 C 18 74, -10 72, -10 64 Z" 
          fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Main Glass Bubble Outer Rim Shadow -->
  <circle cx="64" cy="64" r="38" fill="#c084fc" opacity="0.2" filter="url(#softGlow)" />

  <!-- The 3D Heart inside -->
  <g transform="translate(64, 66) scale(0.95) translate(-64, -64)">
    <path d="M 64 78 
             C 64 78, 44 62, 44 48 
             C 44 38, 52 32, 60 38 
             C 62 40, 64 43, 64 43 
             C 64 43, 66 40, 68 38 
             C 76 32, 84 38, 84 48 
             C 84 62, 64 78, 64 78 Z" 
          fill="url(#heartGrad)" />
    
    <!-- Heart 3D highlight / sheen -->
    <path d="M 52 40 C 47 44, 47 50, 52 56 C 50 51, 51 45, 55 42 C 58 39, 61 40, 60 38 C 57 36, 54 37, 52 40 Z" 
          fill="#ffffff" opacity="0.8" />
    <circle cx="72" cy="42" r="3.5" fill="#ffffff" opacity="0.75" />
  </g>

  <!-- Translucent Glass Sphere overlay -->
  <circle cx="64" cy="64" r="38" fill="url(#bubbleGrad)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Glass reflections & curvature crescents -->
  <!-- Top-left bright specular reflection -->
  <ellipse cx="50" cy="40" rx="14" ry="7" transform="rotate(-30 50 40)" fill="#ffffff" opacity="0.85" />
  <circle cx="68" cy="35" r="3" fill="#ffffff" opacity="0.9" />

  <!-- Bottom-right soft rim light -->
  <path d="M 45 92 A 38 38 0 0 0 95 68" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

  <!-- Front part of the tilted planetary ring -->
  <g transform="rotate(-25 64 64)">
    <path d="M -8 64 C -8 82, 136 82, 136 64" 
          fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round" />
    <path d="M -6 63 C -6 80, 134 80, 134 63" 
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Left 3D Chrome Star -->
  <g transform="translate(18, 68) scale(0.9)">
    <!-- 5 point soft puffed star -->
    <path d="M 12 0 L 15 8 L 24 9 L 17 15 L 19 24 L 12 19 L 5 24 L 7 15 L 0 9 L 9 8 Z" 
          fill="url(#starGrad)" stroke="#64748b" stroke-width="0.75" />
    <polygon points="12,2 14,8 20,9 15,14 12,10" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Right 4-Point Sparkle Star -->
  <g transform="translate(100, 78) scale(0.85)">
    <path d="M 12 0 Q 12 12 0 12 Q 12 12 12 24 Q 12 12 24 12 Q 12 12 12 0 Z" 
          fill="#ede9fe" stroke="#c4b5fd" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#ffffff" />
  </g>

  <!-- Mini twinkle star top right -->
  <g transform="translate(88, 18) scale(0.45)">
    <path d="M 12 0 Q 12 12 0 12 Q 12 12 12 24 Q 12 12 24 12 Q 12 12 12 0 Z" 
          fill="#ffffff" opacity="0.95" />
  </g>
</svg>
